name: Build Android APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: ☕ Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 📦 Install dependencies
        run: npm install --legacy-peer-deps

      - name: 🏗️ Run Expo Prebuild (Generate Native Android Project)
        run: npx expo prebuild --platform android --clean

      - name: 🔨 Build Android APK via Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 📤 Upload APK Artifact to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: StudyTracker-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: 🚀 Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "StudyTracker Android APK (Build #${{ github.run_number }})"
          body: |
            ## 📱 StudyTracker Android Standalone APK
            
            ### ✨ Features
            - ⏰ **10-Hour Master Daily Schedule** with live timer & active block indicator
            - ⚡ **Electric In-App Notification Card** (Light Electric Cyan `#00F5FF`, hard to miss!)
            - 🔓 **No Day Lock**: Browse all 90 days or advance ahead freely
            - 📊 **Learning History & Analytics**: Streaks, completed days, and phase progress
            - 🌙 **Modern Midnight Black & Forest White Aesthetic** (No truncated text)
            
            ### 📥 Download & Install
            Download the attached `app-debug.apk` file directly on your Android phone and tap to install.
          files: android/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
